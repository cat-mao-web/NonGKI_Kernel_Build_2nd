name: Build OPPO Reno5 5G ColorOS 13 Kernel

on:
  workflow_call:
  workflow_dispatch:

env:
  # Device env
  DEVICE_NAME : "OPPO Reno5 5G"
  DEVICE_CODENAME : "PEGM00"

  CUSTOM_CMDS : "CLANG_TRIPLE=aarch64-linux-gnu-"
  EXTRA_CMDS : "LD=ld.lld LLVM=1 LLVM_IAS=1"

  KERNEL_SOURCE : "https://github.com/oppo-source/android_kernel_oppo_sm7250.git"
  KERNEL_BRANCH : "oppo/sm7250_t_13.1.0_reno5_5g"

  CLANG_SOURCE : "https://github.com/llvm/llvm-project/releases/download/llvmorg-19.1.7/LLVM-19.1.7-Linux-X64.tar.xz"
  CLANG_BRANCH : ""

  GCC_GNU : false
  GCC_64_SOURCE : "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9.git"
  GCC_64_BRANCH : "android12L-release"
  GCC_32_SOURCE : "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9.git"
  GCC_32_BRANCH : "android12L-release"

  DEFCONFIG_SOURCE: ""
  DEFCONFIG_NAME : "vendor/lito-perf_defconfig"
  DEFCONFIG_ORIGIN_IMAGE: ""
  DEFCONFIG_FROM_BOOT: false

  KERNELSU_SOURCE : ""
  KERNELSU_BRANCH : ""

  KERNELSU_AUTO_GET : "true"
  KERNELSU_AUTO_FORK : "resukisu" # ReSukiSU with SuSFS support

  SUSFS_ENABLE : true
  SUSFS_FIXED : false

  AK3_SOURCE : "https://github.com/osm0sis/AnyKernel3.git"
  AK3_BRANCH : "master"

  BOOT_SOURCE : ""

  NEED_DTBO : false
  NEED_SAFE_DTBO : false

  ROM_TEXT : "ColorOS_13.1_Android13"

  # Other env
  PYTHON_VERSION: "3"

  PACK_METHOD: "Anykernel3"

  KERNELSU_METHOD: "shell"

  PATCHES_SOURCE: ""
  PATCHES_BRANCH: ""

  SUSFS_FOLDER_FIXED: ""
  SUSFS_PATCH_FIXED: ""

  REKERNEL_ENABLE: "false"

  HOOK_METHOD: "inline"
  HOOK_OLDER: "false"

  KERNEL_PATCH: "false"

  KPM_ENABLE: "true"
  KPM_INLINE: "true"
  KPM_KPATCH_NEXT: "false"
  KPM_PATCH_SOURCE: "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU_patch/refs/heads/main/kpm/patch_linux"

  BASEBAND_GUARD_ENABLE: "true"
  BASEBAND_GUARD_BOOT: "false"

  HIDE_STUFF: "false"

  GENERATE_DTB: "false"
  GENERATE_CHIP: "qcom"

  BUILD_DEBUGGER: "true"
  SKIP_PATCH: "false"

  BUILD_OTHER_CONFIG: "true"
  MERGE_CONFIG_FILES: "vendor/debugfs.config"

  FREE_MORE_SPACE: "false"

jobs:
  build-kernel:
    name: Build Kernel
    runs-on: ubuntu-latest
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"

    steps:
      - name: ⏰ Checkout repository
        uses: actions/checkout@v4

      - name: ⌛️ Compilation environment preparation
        uses: ./.github/workflows/build-env

      - name: ⚙️ Get neccssary tools
        uses: ./.github/workflows/build-ready

      - name: 🪝 Patch Kernel of SUSFS
        uses: ./.github/workflows/patch-susfs

      - name: 🔗 Patch for no-kprobe
        uses: ./.github/workflows/patch-no-kprobe

      - name: 🪛 Extra Kernel Options
        run: |
          # Fix missing Kconfig files for OPPO Reno5 5G
          cd $GITHUB_WORKSPACE/device_kernel

          # Create missing kernel/sched_assist/Kconfig
          if [ ! -f "kernel/sched_assist/Kconfig" ]; then
            echo "Creating missing kernel/sched_assist/Kconfig"
            mkdir -p kernel/sched_assist
            cat > kernel/sched_assist/Kconfig <<'EOF'
config OPLUS_FEATURE_SCHED_ASSIST
	bool "OPLUS schedule assist"
	default n
	help
	  Enable OPLUS schedule assist features for better performance.
EOF
          fi

          # Create missing kernel/tuning/Kconfig
          if [ ! -f "kernel/tuning/Kconfig" ]; then
            echo "Creating missing kernel/tuning/Kconfig"
            mkdir -p kernel/tuning
            cat > kernel/tuning/Kconfig <<'EOF'
config OPLUS_FEATURE_PERFORMANCE_TUNING
	bool "OPLUS performance tuning"
	default n
	help
	  Enable OPLUS performance tuning features.
EOF
          fi

          # Verify defconfig exists
          echo "==========================================="
          echo "Verifying defconfig: $DEFCONFIG_NAME"
          echo "==========================================="

          if [ ! -f "arch/arm64/configs/$DEFCONFIG_NAME" ]; then
            echo "ERROR: $DEFCONFIG_NAME not found!"
            echo "Available defconfigs in vendor/:"
            ls -la arch/arm64/configs/vendor/
            exit 1
          fi

          echo "✓ Defconfig file exists: arch/arm64/configs/$DEFCONFIG_NAME"
          echo "✓ First 5 lines of the defconfig:"
          head -5 "arch/arm64/configs/$DEFCONFIG_NAME"

          echo ""
          echo "Kconfig fixes applied successfully"

      - name: 🧰 Patch Kernel of Re:Kernel
        uses: ./.github/workflows/patch-rekernel

      - name: 🔒 Patch Kernel of Baseband Guard
        uses: ./.github/workflows/patch-baseband-guard

      - name: 🔧 Patch Hide Stuff
        uses: ./.github/workflows/patch-hide-stuff

      - name: 🚀 Build Process
        uses: ./.github/workflows/build-process

      - name: 🔩 Pack Process
        uses: ./.github/workflows/pack-process

      - name: ✏️ Upload Artifacts
        uses: ./.github/workflows/upload-files
